<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380">
  <defs>
    <!-- Soft 3D drop shadow -->
    <filter id="bevel3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="white3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5f5f7" />
      <stop offset="100%" stop-color="#e2e4e8" />
    </linearGradient>
  </defs>

  <g filter="url(#bevel3d)" fill="url(#white3d)" stroke="#222222" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Render text with bold clean font -->
    <text x="460" y="270" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif" 
          font-size="240" 
          font-weight="900" 
          letter-spacing="-6"
          text-anchor="middle">c·três</text>
  </g>
</svg>